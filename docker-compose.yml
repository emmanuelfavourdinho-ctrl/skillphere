version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: trusttrade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trusttrade
      POSTGRES_PASSWORD: trusttrade
      POSTGRES_DB: trusttrade
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
